worker_processes  auto;
pid               /tmp/nginx.pid;
error_log         /dev/stderr warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    # Keep every writable path under /tmp so the container can run with a
    # read-only root filesystem.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/xml image/svg+xml
                      application/manifest+json;

    server {
        listen      8080;
        server_name _;
        root        /usr/share/nginx/html;
        index       index.html;

        add_header X-Content-Type-Options "nosniff"        always;
        add_header X-Frame-Options        "SAMEORIGIN"     always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

        # Liveness/readiness endpoint — must not be rewritten to index.html.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = / {
            return 301 /cp/;
        }

        location = /cp {
            return 301 /cp/;
        }

        # Vite emits content-hashed filenames into /assets under the /cp base.
        location /cp/assets/ {
            alias /usr/share/nginx/html/assets/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff"        always;
            add_header X-Frame-Options        "SAMEORIGIN"     always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
        }

        # Strip the public /cp/ prefix when resolving generated files.
        location /cp/ {
            rewrite ^/cp/(.*)$ /$1 break;
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # The HTML shell must never be cached, or clients pin an old asset graph.
        location = /index.html {
            add_header Cache-Control "no-store, must-revalidate";
            add_header X-Content-Type-Options "nosniff"        always;
            add_header X-Frame-Options        "SAMEORIGIN"     always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
        }

        # Direct /cp/index.html requests must behave like the HTML shell.
        location = /cp/index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-store, must-revalidate";
            add_header X-Content-Type-Options "nosniff"        always;
            add_header X-Frame-Options        "SAMEORIGIN"     always;
            add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
            try_files /index.html =404;
        }
    }
}
